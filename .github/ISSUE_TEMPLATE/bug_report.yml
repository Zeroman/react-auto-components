name: 缺陷报告
description: 提供可复现的问题
body:
  - type: input
    id: version
    attributes:
      label: 组件库版本
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: React、浏览器、操作系统和构建工具版本。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现
      description: 提供可运行示例、复现链接或完整操作步骤，请勿包含凭据或业务数据。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 可附相关报错或截图。
    validations:
      required: true
