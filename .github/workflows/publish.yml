name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ci.yml's push-to-main job runs a chromium-only matrix, so a successful
  # "verify" check-run on the tagged commit does not prove the Firefox/WebKit
  # release matrix. The tag must always run its own full verification.
  verify:
    if: github.repository == 'Zeroman/react-auto-components'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - name: Require npm trusted publishing support
        run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:public
      - run: pnpm check:docs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm prepare:test-project
      - run: pnpm --dir test-project build
      - run: pnpm exec playwright install --with-deps
      # Release gate: full matrix (chromium + firefox + webkit).
      - run: pnpm test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-project/test-results/
          retention-days: 7

  publish:
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - name: Require npm trusted publishing support
        run: npm install -g npm@^11.5.1
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match package.json $version"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: node scripts/publish-packages.mjs
