name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      browser_project:
        description: Browser engine to verify (all runs the release matrix)
        type: choice
        default: all
        options: [all, chromium, firefox, webkit]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAC_E2E_PROJECT: ${{ inputs.browser_project || 'chromium' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:public
      - run: pnpm check:docs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm prepare:test-project
      - run: pnpm --dir test-project build
      - run: |
          if [ "$RAC_E2E_PROJECT" = all ]; then
            pnpm exec playwright install --with-deps
          else
            # DevTools managed-page screenshots use Chromium in every engine's tests.
            pnpm exec playwright install --with-deps chromium "$RAC_E2E_PROJECT"
          fi
      # Pushes/PRs use Chromium; manual runs default to all and can verify one engine.
      - run: |
          if [ "$RAC_E2E_PROJECT" = all ]; then
            pnpm test:e2e
          else
            pnpm test:e2e --project="$RAC_E2E_PROJECT"
          fi
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-project/test-results/
          retention-days: 7
